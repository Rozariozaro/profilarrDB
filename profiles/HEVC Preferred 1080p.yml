name: HEVC Preferred 1080p
description: "This profile prefers efficient, streaming-like releases.  \n- Primary\
  \ target: 1080p HEVC/x265 (~2.5\u20133GB max).  \n- Fallback: 1080p x264 if HEVC\
  \ unavailable.  \n- Secondary fallback: 720p HEVC (~1.5\u20132GB), then 720p x264.\
  \  \n- Streaming service sources (WEB-DL, WEBRip) are prioritized.  \n- Oversized\
  \ encodes (above the set MB/min limit) are rejected.  \n- Automatic upgrades allowed\
  \ only when seeders \u22655 and size/quality improvement is meaningful.  \nDesigned\
  \ for a balance of quality, efficiency, and good availability."
